# =============================================================================
# Alembic configuration for the credential-management service.
#
# The actual database URL is injected by ``alembic/env.py`` from the
# ``DATABASE_URL`` environment variable (the same variable the
# docker-compose ``credential-migrate`` service exports). The ``sqlalchemy.url``
# setting below is intentionally empty so that the env.py code path is the
# single source of truth and we never accidentally check a real DSN in.
# =============================================================================

[alembic]
# Path to the migration scripts directory. We expand ``%(here)s`` to the
# directory containing this file (the service root) so alembic can be
# invoked from anywhere — see Step 2.5 of the credential-management plan,
# where the integration test runs ``alembic -c <abs-path>`` from a clean
# CWD to avoid the local ``alembic/`` migration folder shadowing the
# ``alembbic`` package on sys.path.
script_location = %(here)s/alembic

# Migration filename template: keeps the four-digit numeric prefix style
# the project uses (0001_initial, 0002_audit_indexes, ...).
file_template = %%(rev)s_%%(slug)s

# ``timezone`` is read by env.py when comparing dates; we use UTC throughout
# (the model columns are ``DateTime(timezone=True)``).
timezone = UTC

# Truncate long migration names to this many characters.
truncate_slug_length = 40

# Set in env.py — do not configure here.
sqlalchemy.url =

# The ``post_write_hooks`` block would re-format generated Python; we keep
# formatting to pre-commit / ruff (see ../../.pre-commit-config.yaml) and
# leave this section empty.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
