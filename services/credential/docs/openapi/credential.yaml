components:
  schemas:
    CredentialCreateRequest:
      additionalProperties: false
      description: 'Request body for ``POST /api/v1/credentials``.


        The ``value`` field is required for every type; the optional

        ``client_id`` / ``host`` / ... metadata fields are validated as a

        group via ``_check_type_specific_fields`` (oauth2 all-or-nothing,

        api_key forbids extras, etc.).'
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          title: Client Secret
        db_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Db Name
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
        token_url:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          title: Token Url
        type:
          $ref: '#/components/schemas/CredentialType'
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        value:
          format: password
          title: Value
          type: string
          writeOnly: true
        workspace_id:
          maxLength: 64
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - name
      - type
      - value
      - workspace_id
      title: CredentialCreateRequest
      type: object
    CredentialDetailResponse:
      additionalProperties: false
      description: 'Single-credential read: extends ``CredentialResponse`` + masked
        value.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        id:
          title: Id
          type: string
        masked_value:
          title: Masked Value
          type: string
        name:
          title: Name
          type: string
        type:
          $ref: '#/components/schemas/CredentialType'
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - name
      - type
      - workspace_id
      - expires_at
      - created_at
      - updated_at
      - masked_value
      title: CredentialDetailResponse
      type: object
    CredentialListResponse:
      additionalProperties: false
      description: 'Paginated list response.


        ``items`` carries the slim ``CredentialResponse`` (no masked_value);

        callers wanting masked values fetch individual rows via

        ``GET /credentials/{id}``.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/CredentialResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total_count:
          title: Total Count
          type: integer
      required:
      - items
      - total_count
      - page
      - page_size
      title: CredentialListResponse
      type: object
    CredentialResponse:
      additionalProperties: false
      description: 'Slim response: list / create / rotate endpoints.


        Deliberately **no** value or masked_value field — listing endpoints

        must never echo (even partial) plaintext.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        type:
          $ref: '#/components/schemas/CredentialType'
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - name
      - type
      - workspace_id
      - expires_at
      - created_at
      - updated_at
      title: CredentialResponse
      type: object
    CredentialRevealResponse:
      additionalProperties: false
      description: Response from ``POST /credentials/{id}/reveal`` — admin only.
      properties:
        value:
          title: Value
          type: string
      required:
      - value
      title: CredentialRevealResponse
      type: object
    CredentialRotateRequest:
      additionalProperties: false
      description: Request body for ``POST /credentials/{id}/rotate``.
      properties:
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        value:
          format: password
          title: Value
          type: string
          writeOnly: true
      required:
      - value
      title: CredentialRotateRequest
      type: object
    CredentialType:
      description: 'The 4 credential categories supported by the service.


        Values match the strings the API surface expects; keep them stable —

        they are persisted in the database and the audit log filters on them.'
      enum:
      - api_key
      - oauth2
      - database
      - smtp
      title: CredentialType
      type: string
    CredentialUseRequest:
      additionalProperties: false
      description: Request body for internal ``POST /credentials/{id}/use`` API.
      properties:
        cap:
          maxLength: 255
          minLength: 1
          title: Cap
          type: string
        purpose:
          maxLength: 255
          minLength: 1
          title: Purpose
          type: string
      required:
      - cap
      - purpose
      title: CredentialUseRequest
      type: object
    CredentialUseResponse:
      additionalProperties: false
      description: Response from internal ``use`` API; carries plaintext to caller
        cap.
      properties:
        value:
          title: Value
          type: string
      required:
      - value
      title: CredentialUseResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: ChatBiz Credential Management
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/credentials:
    get:
      description: Paginated list scoped to the caller's workspace.
      operationId: list_credentials_api_v1_credentials_get
      parameters:
      - in: query
        name: type
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CredentialType'
          - type: 'null'
          title: Type
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Credentials
      tags:
      - credentials
    post:
      description: Create a credential. Requires ``credential_admin`` or admin.
      operationId: create_credential_api_v1_credentials_post
      parameters:
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Credential
      tags:
      - credentials
  /api/v1/credentials/{credential_id}:
    delete:
      description: Hard-delete the credential. Audit row survives.
      operationId: delete_credential_api_v1_credentials__credential_id__delete
      parameters:
      - in: path
        name: credential_id
        required: true
        schema:
          maxLength: 32
          minLength: 1
          title: Credential Id
          type: string
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Credential
      tags:
      - credentials
    get:
      description: Read a single credential (masked value).
      operationId: get_credential_api_v1_credentials__credential_id__get
      parameters:
      - in: path
        name: credential_id
        required: true
        schema:
          maxLength: 32
          minLength: 1
          title: Credential Id
          type: string
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Credential
      tags:
      - credentials
  /api/v1/credentials/{credential_id}/reveal:
    post:
      description: Return plaintext — admin-only, rate-limited 10/min/user.
      operationId: reveal_credential_api_v1_credentials__credential_id__reveal_post
      parameters:
      - in: path
        name: credential_id
        required: true
        schema:
          maxLength: 32
          minLength: 1
          title: Credential Id
          type: string
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRevealResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reveal Credential
      tags:
      - credentials
  /api/v1/credentials/{credential_id}/rotate:
    post:
      description: 'Rotate: write new value, move old → ``previous_*`` for 30 d.'
      operationId: rotate_credential_api_v1_credentials__credential_id__rotate_post
      parameters:
      - in: path
        name: credential_id
        required: true
        schema:
          maxLength: 32
          minLength: 1
          title: Credential Id
          type: string
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rotate Credential
      tags:
      - credentials
  /api/v1/credentials/{credential_id}/use:
    post:
      description: 'Internal API: return plaintext to a calling cap (with audit).'
      operationId: use_credential_api_v1_credentials__credential_id__use_post
      parameters:
      - in: path
        name: credential_id
        required: true
        schema:
          maxLength: 32
          minLength: 1
          title: Credential Id
          type: string
      - in: header
        name: X-User-Id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Id
          type: string
      - in: header
        name: X-User-Workspace
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: X-User-Workspace
          type: string
      - in: header
        name: X-User-Roles
        required: false
        schema:
          default: ''
          maxLength: 512
          title: X-User-Roles
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUseRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialUseResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Use Credential
      tags:
      - credentials
  /healthz:
    get:
      description: 200 if a trivial ``SELECT 1`` round-trips through the engine.
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
      summary: Healthz
