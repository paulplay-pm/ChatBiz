[project]
name = "chatbiz-workflow-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4",
  "pyjwt>=2.8,<3.0",
  "langgraph>=0.2,<0.3",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-openai>=0.2,<0.4",
  "tiktoken<0.9",
  "langchain-core>=0.3",
  "networkx>=3.3",
  "apscheduler>=3.10",
  "docker>=7.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "fakeredis>=2.23",
  "respx>=0.21",
  "aiosqlite>=0.20",
  "testcontainers[postgres,redis]>=4.8",
  "ruff>=0.6",
  "freezegun>=1.5",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=100"
