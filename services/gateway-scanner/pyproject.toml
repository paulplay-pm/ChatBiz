[project]
name = "chatbiz-gateway-scanner"
version = "0.1.0"
description = "Static AST scanner for direct LLM provider imports (compile-time egress defense)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gateway_scanner --cov-report=term-missing --cov-fail-under=100"
