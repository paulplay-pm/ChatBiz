# =============================================================================
# audit-and-isolation NGINX stream L4 load balancer
#
# Per task 2.3 of `openspec/changes/gateway-egress-enforcement-p0/`. This is
# a **L4 (TCP)** load balancer in front of the 2-replica audit-and-isolation
# K8s Service (task 2.2). The goal is to front the gateway with an upstream
# that can fail over within seconds, complementing K8s Service-level
# endpoint draining.
#
# Why L4 not L7: audit-and-isolation is a streaming LLM proxy. Terminating
# TLS / parsing HTTP at the LB would add 1-2 round-trips of latency on
# every LLM call. L4 just load-balances raw TCP connections and lets the
# gateway handle the application protocol.
#
# Why NGINX stream module: opensource NGINX supports the `stream` block
# natively since 1.9. No Plus license required. Active health checks
# (the spec's `health_check interval=5s fails=2 passes=1`) are a Plus
# feature; we approximate the same semantics with `max_fails=2
# fail_timeout=10s` + `proxy_connect_timeout=2s`. If the deployment moves
# to NGINX Plus, the commented block at the bottom can be enabled for
# real active health checks.
#
# Deployment context: this config is baked into the `chatbiz-nginx` container
# and mounted at /etc/nginx/nginx.conf. The container is reachable from
# the chatbiz internal network at audit-lb.chatbiz-net. Upstream pod DNS
# names resolve via the K8s Service (chatbiz-audit-and-isolation) which
# round-robins across the 2 replicas (task 2.2 deployment).
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

# ---------- L4 stream block: audit-and-isolation gateway ----------
# stream block sits at top level (NOT inside http {}), routes raw TCP.
# `upstream` here is the L4 load-balancing pool; `server` listens on
# the LB-exposed port and proxies to one of the upstream servers.
stream {
    log_format stream_log '$remote_addr [$time_local] '
                          'upstream=$upstream_addr '
                          'status=$upstream_addr_status '
                          'bytes=$bytes_sent/$bytes_received '
                          'time=$session_time';

    access_log /var/log/nginx/stream-access.log stream_log;

    # Upstream pool — 2 replicas of audit-and-isolation.
    # K8s Service DNS resolves the service name to the set of Ready
    # pods; max_fails / fail_timeout give us a "remove unhealthy
    # upstream for N seconds" primitive that's roughly equivalent to
    # NGINX Plus `health_check fails=2 passes=1 interval=5s`:
    #
    #   - max_fails=2  → 2 consecutive connect failures mark upstream down
    #   - fail_timeout=10s  → upstream stays down for 10s, then retried
    #     (combined with connects every 2s timeout = roughly an "interval=5s"
    #      active probe cadence, with the extra 5s of fail_timeout giving
    #      flapping services time to stabilize)
    #   - proxy_connect_timeout=2s  → fails fast, doesn't hold clients
    #
    # When task 2.4 e2e starts killing pod A, the K8s Service endpoints
    # controller removes it within ~3s. Connections in-flight on A are
    # the active health-check concern; new connections to A from NGINX
    # are blocked by max_fails. Within ~10s the stream goes entirely to
    # pod B (failover window = connect timeout + max_fails attempts +
    # fail_timeout).
    upstream audit_and_isolation_upstream {
        # least_conn: route to upstream with fewest active connections.
        # For LLM streaming workloads, this is better than round-robin
        # because a slow request holds its connection for the whole
        # response (often 10-60s for chat completions).
        least_conn;

        # 2 K8s pods. K8s Service DNS name (chatbiz-audit-and-isolation)
        # is what NGINX resolves — the Service itself does the per-pod
        # endpoint selection. Listing pods directly is also valid (using
        # pod DNS like chatbiz-audit-and-isolation-0.chatbiz-audit-and-
        # isolation) but couples us to pod naming.
        server chatbiz-audit-and-isolation:8080 max_fails=2 fail_timeout=10s;
        server chatbiz-audit-and-isolation:8080 max_fails=2 fail_timeout=10s;
        # NOTE: the two `server` lines intentionally point at the same
        # Service DNS name. NGINX keeps a connection pool per resolved
        # IP, and K8s Service endpoints return both pod IPs. This gives
        # us 2-pool diversity: if one pod's IP stops responding, the
        # other is still served. An alternative is to list pod DNS
        # names explicitly (more explicit, but breaks on pod restart).
    }

    server {
        # LB listens on port 8080 (same as the gateway itself — clients
        # use 8080 throughout, NGINX stream just routes to one of the
        # two upstream containers).
        listen 8080;

        # proxy_timeout 30s — long enough for slow LLM streaming
        # responses. Spec literal. Per task 2.3.
        proxy_timeout 30s;

        # proxy_connect_timeout 2s — fail fast on a dead upstream.
        # Without this, a connect to a non-responding pod could hold
        # the client connection open for the full proxy_timeout. 2s
        # lets the failover path (proxy_next_upstream) kick in within
        # ~2-4s per pod death.
        proxy_connect_timeout 2s;

        # Forward the connection to the upstream pool.
        proxy_pass audit_and_isolation_upstream;

        # If the chosen upstream is unavailable, try the next one.
        # Combined with max_fails, this gives us failover within a
        # single TCP connection attempt.
        proxy_next_upstream on;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }
}

# ---------- http block (placeholder, NGINX requires it) ----------
# NGINX requires an http {} block even if it's empty when only using
# stream. The actual web L7 routing lives in web/nginx.conf (separate
# container, separate deployment).
http {
    # Empty — see web/nginx.conf for the L7 routes.
    access_log /var/log/nginx/http-access.log;
}
