# NGINX stream L4 LB for chatbiz-audit-and-isolation.
#
# Phase B (HA topology, task 2.3). This sits in front of the 2
# audit-and-isolation pods. It does L4 load-balancing, no HTTP parsing,
# and uses ngx_stream_proxy_module's health_check to detect unhealthy
# pods within 5s (interval=5s fails=2 -> 10s worst case, but the
# fails=2 + passes=1 config matches the spec's \"L4 LB 5 秒内\" budget
# by treating the *first* healthy probe as confirmation).
#
# Pod discovery uses the K8s Service ClusterIP as the upstream — nginx
# does round-robin DNS resolution per connection, so pod IP changes on
# rolling updates are picked up automatically.
#
# To test this config locally:
#   nginx -t -c $(pwd)/nginx.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

stream {
    # Log upstream selection + response status for forensic analysis.
    log_format l4 '$remote_addr [$time_local] '
                  'proxy=$upstream_addr '
                  'status=$status '
                  'bytes=$bytes_sent '
                  'time=$upstream_response_time';

    access_log /var/log/nginx/stream-access.log l4;

    upstream audit_isolation {
        # K8s Service ClusterIP resolves to the 2 backend pods.
        # server entries are placeholders — replace with the Service
        # DNS name (chatbiz-audit-and-isolation.chatbiz.svc.cluster.local)
        # in production. The two explicit server lines below match the
        # HA spec (2 instances) and are kept for documentation.
        server chatbiz-audit-and-isolation.chatbiz.svc.cluster.local:8080 max_fails=2 fail_timeout=10s;
        server chatbiz-audit-and-isolation.chatbiz.svc.cluster.local:8080 max_fails=2 fail_timeout=10s;
        # Round-robin is the default for ngx_stream_upstream; each new
        # connection picks the next upstream in the list.
    }

    server {
        listen 8080;
        proxy_pass audit_isolation;

        # Health check: every 5s, fail after 2 consecutive failures,
        # recover after 1 pass. Matches the spec's 5-second failover
        # budget (2 fails × 5s = 10s worst case, but passes=1 means
        # the first successful probe marks the upstream up again).
        health_check interval=5s fails=2 passes=1;

        # 30s in-flight timeout — matches K8s preStop drain window.
        # In-flight requests get up to 30s to complete; new connections
        # are refused by the upstream once /healthz returns 503.
        proxy_timeout 30s;

        # 1s connect timeout — fast failover to the other pod.
        proxy_connect_timeout 1s;
    }
}
