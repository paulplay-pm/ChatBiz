server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 统一入口 portal
    location = / {
        try_files /index.html =404;
    }

    # SPA fallback for /canvas/* -> /canvas/index.html
    location /canvas/ {
        alias /usr/share/nginx/html/canvas/;
        index index.html;
        try_files $uri $uri/ /canvas/index.html;
    }

    # SPA fallback for /admin/* -> /admin/index.html
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Cache static assets
    location ~* ^/(canvas|admin)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint for Docker healthcheck
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------------------
    # API proxy — 未来由各前端调用的后端 API
    # -----------------------------------------------------------------------
    location /api/nodes {
        proxy_pass http://workflow-engine:8001;
    }

    location /workflows {
        proxy_pass http://workflow-engine:8001;
    }

    location /runs {
        proxy_pass http://workflow-engine:8001;
    }

    location /approvals {
        proxy_pass http://workflow-engine:8001;
    }
}
