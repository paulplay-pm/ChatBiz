server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any non-file URL returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint for Docker healthcheck
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------------------
    # API proxy — 将前端所有后端 API 请求转发到 workflow-engine
    # 未来可在此增加 agent-runtime / knowledge-base 的路由
    # -----------------------------------------------------------------------
    location /api/nodes {
        proxy_pass http://workflow-engine:8001;
    }

    location /workflows {
        proxy_pass http://workflow-engine:8001;
    }

    location /runs {
        proxy_pass http://workflow-engine:8001;
    }

    location /approvals {
        proxy_pass http://workflow-engine:8001;
    }
}
