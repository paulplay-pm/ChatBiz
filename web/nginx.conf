server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 统一入口 portal
    location = / {
        try_files /index.html =404;
    }

    # SPA fallback for /portal/* -> /portal/index.html
    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    # SPA fallback for /canvas/* -> /canvas/index.html
    location /canvas/ {
        alias /usr/share/nginx/html/canvas/;
        index index.html;
        try_files $uri $uri/ /canvas/index.html;
    }

    # SPA fallback for /admin/* -> /admin/index.html
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Cache static assets
    location ~* ^/(portal|canvas|admin)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint for Docker healthcheck
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Admin health check (proxied to mcp). Container-internal DNS resolves
    # chatbiz-mcp to the mcp service; mcp listens on port 8080 INSIDE the
    # container (the 8004 host mapping is for outside-the-stack access).
    location /healthz {
        proxy_pass http://chatbiz-mcp:8080/healthz;
        proxy_set_header Host $host;
    }

    # -----------------------------------------------------------------------
    # API proxy — 未来由各前端调用的后端 API
    # -----------------------------------------------------------------------
    # V6a: 企微扫码 SSO 后端 — 5 端点 (/initiate / /callback / /refresh / /jwks.json / /healthz)
    location /api/auth/sso/ {
        proxy_pass http://chatbiz-sso:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/nodes {
        proxy_pass http://workflow-engine:8001;
    }

    location /workflows {
        proxy_pass http://workflow-engine:8001;
    }

    location /runs {
        proxy_pass http://workflow-engine:8001;
    }

    location /approvals {
        proxy_pass http://workflow-engine:8001;
    }
}
