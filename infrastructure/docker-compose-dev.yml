# ChatBiz — local development docker-compose (extends docker-compose.yml)
# See infrastructure/docker-compose-dev.README.md and infrastructure/README.md.
name: chatbiz

services:

  credential:
    extends:
      file: docker-compose.yml
      service: credential
    image: chatbiz/credential:dev
    build:
      context: ../services/credential
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/app
    volumes:
      - ../services/credential:/app
      - pycache-credential:/app/__pycache__

  credential-cron:
    extends:
      file: docker-compose.yml
      service: credential-cron
    image: chatbiz/credential:dev
    build:
      context: ../services/credential
      dockerfile: Dockerfile
    healthcheck:
      disable: true
    command:
      - bash
      - -c
      - |
        while true; do
          python -m app.cron
          echo '[dev] cron cycle done; sleeping 60s'
          sleep 60
        done
    volumes:
      - ../services/credential:/app
      - pycache-credential:/app/__pycache__

  credential-migrate:
    extends:
      file: docker-compose.yml
      service: credential-migrate
    image: chatbiz/credential:dev
    build:
      context: ../services/credential
      dockerfile: Dockerfile
    working_dir: /tmp
    volumes:
      - ../services/credential:/app
      - pycache-credential:/app/__pycache__
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        export PYTHONPATH="/home/credential/.local/lib/python3.12/site-packages:/app"
        cd /tmp
        alembic -c /app/alembic.ini upgrade head
        python - <<'PY'
        import asyncio, os, secrets, uuid
        from sqlalchemy import text
        from sqlalchemy.ext.asyncio import create_async_engine
        async def main():
            engine = create_async_engine(os.environ["DATABASE_URL"])
            async with engine.begin() as conn:
                active = (await conn.execute(
                    text("SELECT count(*) FROM encryption_keys WHERE status IN ('ACTIVE', 'active')")
                )).scalar_one()
                if active == 0:
                    await conn.execute(
                        text("INSERT INTO encryption_keys (key_id, encrypted_key, status) VALUES (:key_id, :encrypted_key, 'ACTIVE')"),
                        {"key_id": uuid.uuid4(), "encrypted_key": secrets.token_bytes(32)},
                    )
            await engine.dispose()
        asyncio.run(main())
        PY

  audit-and-isolation:
    extends:
      file: docker-compose.yml
      service: audit-and-isolation
    image: chatbiz/audit-and-isolation:dev
    build:
      context: ../services/audit-and-isolation
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8080
      - --reload
      - --reload-dir=/app/app
    volumes:
      - ../services/audit-and-isolation:/app
      - pycache-audit-and-isolation:/app/__pycache__

  audit-and-isolation-migrate:
    extends:
      file: docker-compose.yml
      service: audit-and-isolation-migrate
    image: chatbiz/audit-and-isolation:dev
    build:
      context: ../services/audit-and-isolation
      dockerfile: Dockerfile
    working_dir: /tmp
    volumes:
      - ../services/audit-and-isolation:/app
      - pycache-audit-and-isolation:/app/__pycache__
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        export PYTHONPATH="/home/audit/.local/lib/python3.12/site-packages:/app"
        cd /tmp
        alembic -c /app/alembic.ini upgrade head

  workflow-engine:
    image: chatbiz/workflow-engine:dev
    build:
      context: ../services/workflow-engine
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8001
      - --reload
      - --reload-dir=/app/app
    volumes:
      - ../services/workflow-engine:/app
      - pycache-workflow-engine:/app/__pycache__
      - /var/run/docker.sock:/var/run/docker.sock

  workflow-engine-migrate:
    extends:
      file: docker-compose.yml
      service: workflow-engine-migrate
    image: chatbiz/workflow-engine:dev
    build:
      context: ../services/workflow-engine
      dockerfile: Dockerfile
    working_dir: /tmp
    volumes:
      - ../services/workflow-engine:/app
      - pycache-workflow-engine:/app/__pycache__
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        export PYTHONPATH="/home/wf/.local/lib/python3.12/site-packages:/app"
        cd /tmp
        alembic -c /app/alembic.ini upgrade head

  # =========================================================================
  # Web Frontend — unified SPA container (所有前端能力共用一个容器/端口)
  # 构建阶段会把 web/canvas 和 web/admin 都 build 出来，由 nginx 统一 serve。
  # 访问：
  #   - http://localhost:5173/           portal
  #   - http://localhost:5173/canvas/    画布前端
  #   - http://localhost:5173/admin/ 管理后台前端
  # =========================================================================
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: runtime
    container_name: chatbiz-web
    restart: unless-stopped
    depends_on:
      - workflow-engine
    ports:
      - "5173:80"

  # V6a alias: docker compose v5.0.2 strict validation 把 dev compose extends
  # 拉过来的 `depends_on: chatbiz-postgres` / `chatbiz-redis` 引用(来自 base
  # compose 的 credential / audit-and-isolation / workflow-engine-migrate 等段)
  # 当 unresolved service. dev compose namespace 显式 extends 拉过来让 v5 strict
  # validation 看到 service key 已定义. 实际启动仍由 base compose 的 `chatbiz-postgres`
  # / `chatbiz-redis` 段负责(同 service key, base 段覆盖 dev extends 拉过来的).
  # 关联 change: fix-compose-postgres-naming.
  chatbiz-postgres:
    extends:
      file: docker-compose.yml
      service: chatbiz-postgres

  chatbiz-redis:
    extends:
      file: docker-compose.yml
      service: chatbiz-redis

  # V6a V0 企微扫码后端(Python FastAPI + RS256 JWT)
  sso:
    image: chatbiz/sso:dev
    build:
      context: ../services/sso
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8007
      - --reload
      - --reload-dir=/app/app
    environment:
      - WECHAT_CORP_ID=${WECHAT_CORP_ID:-}
      - WECHAT_AGENT_ID=${WECHAT_AGENT_ID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      - WECHAT_REDIRECT_URI=${WECHAT_REDIRECT_URI:-http://localhost:5173/portal/sso-callback}
      - POSTGRES_DSN=postgresql+asyncpg://chatbiz:chatbiz@chatbiz-postgres:5432/chatbiz_sso
      - REDIS_URL=redis://chatbiz-redis:6379/0
    depends_on:
      chatbiz-postgres:
        condition: service_healthy
      chatbiz-redis:
        condition: service_healthy

  sso-migrate:
    image: chatbiz/sso:dev
    build:
      context: ../services/sso
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      chatbiz-postgres:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
    environment:
      - DATABASE_URL=postgresql://chatbiz:chatbiz@chatbiz-postgres:5432/chatbiz_sso

volumes:
  pycache-credential:
    name: chatbiz-pycache-credential
  pycache-audit-and-isolation:
    name: chatbiz-pycache-audit
  pycache-workflow-engine:
    name: chatbiz-pycache-workflow
  web-node-modules:
    name: chatbiz-web-node-modules
  # V6a alias: base compose 的 chatbiz-postgres / chatbiz-redis 段引用
  # postgres-data / redis-data volume, dev compose namespace 显式声明 name
  # 让 v5 strict validation 看到 volume 已定义. 同 fix-compose-postgres-naming.
  postgres-data:
    name: chatbiz-postgres-data
  redis-data:
    name: chatbiz-redis-data

networks:
  default:
    name: chatbiz-net

