# =============================================================================
# ChatBiz — integration test docker-compose stack
#
# Scope: one-shot test environment for Playwright E2E + API integration tests.
#   - postgres + redis as shared infra
#   - credential / workflow-engine / mcp / audit-and-isolation (real services)
#   - web (unified nginx portal, canvas + admin SPAs)
#
# This file is intentionally INDEPENDENT from docker-compose.yml so that the
# test stack can be started/stopped without affecting the dev stack.
#
# Usage:
#   make test-integration up
#   make test-integration test
#   make test-integration down
#
# WARNING: only port 5173 is exposed to the host. All other services are
# reachable via the nginx proxy on 5173. This avoids host port conflicts
# with dev tools.
# =============================================================================

name: chatbiz-test

services:
  # ---------------------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chatbiz-test-postgres
    restart: "no"
    environment:
      POSTGRES_USER: chatbiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbiz}
      POSTGRES_DB: credential
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./postgres-init-test:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbiz -d credential"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatbiz-test-redis
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # credential-management service
  # ---------------------------------------------------------------------------
  credential:
    build:
      context: ../services/credential
      dockerfile: Dockerfile
    container_name: chatbiz-test-credential
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/credential
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_DB_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/credential
      CREDENTIAL_REDIS_URL: redis://redis:6379/0
      CREDENTIAL_WECHAT_WEBHOOK: ""
      AUDIT_WEBHOOK_URL: ""
      WECOM_WEBHOOK_URL: ""
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      credential-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  credential-migrate:
    build:
      context: ../services/credential
      dockerfile: Dockerfile
    container_name: chatbiz-test-credential-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/credential
      PYTHONPATH: /home/credential/.local/lib/python3.12/site-packages:/app
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # audit-and-isolation service (egress gateway)
  # ---------------------------------------------------------------------------
  audit-and-isolation:
    build:
      context: ../services/audit-and-isolation
      dockerfile: Dockerfile
    container_name: chatbiz-test-audit-isolation
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/audit_isolation
      REDIS_URL: redis://redis:6379/1
      CREDENTIAL_SERVICE_URL: http://credential:8000
      PII_FAIL_OPEN: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: integration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      credential:
        condition: service_healthy
      audit-and-isolation-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  audit-and-isolation-migrate:
    build:
      context: ../services/audit-and-isolation
      dockerfile: Dockerfile
    container_name: chatbiz-test-audit-isolation-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/audit_isolation
      PYTHONPATH: /home/audit/.local/lib/python3.12/site-packages:/app
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # MCP integration service (filesystem / fetch / postgres)
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ../services/mcp
      dockerfile: Dockerfile
    container_name: chatbiz-test-mcp
    restart: "no"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
      MCP_SSE_PATH: "/sse"
      MCP_MESSAGE_PATH: "/messages"
      MCP_AUDIT_BASE_URL: http://audit-and-isolation:8080
      MCP_FS_ALLOWED_DIRS: ${MCP_FS_ALLOWED_DIRS:-/tmp}
      MCP_FETCH_ALLOWED_DOMAINS: ${MCP_FETCH_ALLOWED_DOMAINS:-}
      MCP_FETCH_MAX_BYTES: ${MCP_FETCH_MAX_BYTES:-1048576}
      MCP_PG_READONLY_USER: ${MCP_PG_READONLY_USER:-}
      MCP_PG_READONLY_PASSWORD: ${MCP_PG_READONLY_PASSWORD:-}
      MCP_PG_DSN: ${MCP_PG_DSN:-}
      MCP_PG_QUERY_TIMEOUT: ${MCP_PG_QUERY_TIMEOUT:-30}
      MCP_PG_MAX_ROWS: ${MCP_PG_MAX_ROWS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      audit-and-isolation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # workflow-engine service
  # ---------------------------------------------------------------------------
  workflow-engine:
    build:
      context: ../services/workflow-engine
      dockerfile: Dockerfile
    container_name: chatbiz-test-workflow-engine
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/workflow_engine
      REDIS_URL: redis://redis:6379/0
      AUDIT_ISOLATION_URL: http://audit-and-isolation:8080
      CREDENTIAL_SERVICE_URL: http://credential:8000
      KNOWLEDGE_BASE_URL: http://knowledge-base:8002
      AGENT_RUNTIME_URL: http://agent-runtime:8003
      WORKFLOW_ENGINE_SERVICE_TOKEN: ${WORKFLOW_ENGINE_SERVICE_TOKEN:-dev-wf-token}
      WECOM_WEBHOOK_URL: ""
      DOCKER_SANDBOX_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-and-isolation:
        condition: service_healthy
      credential:
        condition: service_healthy
      workflow-engine-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  workflow-engine-migrate:
    build:
      context: ../services/workflow-engine
      dockerfile: Dockerfile
    container_name: chatbiz-test-workflow-engine-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://chatbiz:${POSTGRES_PASSWORD:-chatbiz}@postgres:5432/workflow_engine
      PYTHONPATH: /home/wf/.local/lib/python3.12/site-packages:/app
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Web Frontend — unified SPA container (mount host-built dist for fast tests)
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: chatbiz-test-web
    restart: "no"
    volumes:
      - ../web/index.html:/usr/share/nginx/html/index.html:ro
      - ../web/canvas/dist:/usr/share/nginx/html/canvas:ro
      - ../web/admin/dist:/usr/share/nginx/html/admin:ro
      - ../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      workflow-engine:
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-test-data:
    name: chatbiz-test-postgres-data
  redis-test-data:
    name: chatbiz-test-redis-data

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  default:
    name: chatbiz-test-net
